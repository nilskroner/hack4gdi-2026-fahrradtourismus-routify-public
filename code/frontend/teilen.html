<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Routify teilen</title>
<link rel="icon" type="image/png" href="/assets/icon.png">
<script src="/static/vendor/qrcode-generator-1.4.4/qrcode.min.js"></script>
<style>
  :root { --ink: #1d2420; --muted: #66706a; --line: #e2e6e2; --accent: #1f7a4d; --accent-soft: #e4f2ea; --warn: #9a5b00; --warn-soft: #fff4e0; }
  html, body { margin: 0; min-height: 100%; background: #f6f7f5; color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
  .karte { background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.06);
    padding: 28px 32px 24px; text-align: center; max-width: 560px; width: 100%; box-sizing: border-box; }
  .logo { width: min(320px, 80%); display: block; margin: 0 auto 6px; border-radius: 12px; }
  h1 { font-size: 22px; margin: 10px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 18px; }
  #qr { display: grid; place-items: center; margin: 0 auto; width: min(380px, 78vw); aspect-ratio: 1; }
  #qr svg { width: 100%; height: 100%; }
  .url { font: 600 20px ui-monospace, SFMono-Regular, Menlo, monospace; margin: 14px 0 4px; word-break: break-all; color: var(--accent); }
  .hinweise { text-align: center; font-size: 17px; color: var(--muted); margin: 18px 0 0; padding: 12px 14px; background: #fafbfa;
    border: 1px solid var(--line); border-radius: 12px; }
  .hinweise li { margin: 3px 0; }
  .warn { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 12px 14px; text-align: left; font-size: 14.5px; margin-bottom: 14px; }
  code { background: #f0f2f0; padding: 1px 5px; border-radius: 5px; font-size: 13px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <div class="karte">
    <img class="logo" src="/assets/banner.jpg" alt="Routify – Say it. Ride it.">
    <h1>Selbst ausprobieren</h1>
    <p class="sub">QR-Code mit dem Handy scannen und eine Radtour planen.</p>
    <div id="warnung"></div>
    <div id="qr"></div>
    <div class="url" id="url">…</div>
    <p class="hinweise">Handy im <b>Hackathon-WLAN</b></p>
  </div>
</main>
<script>
fetch("/api/teilen").then(r => r.json()).then(j => {
  // Wird die Seite schon über die Netzadresse geöffnet, genau diese nehmen
  const url = location.hostname !== "localhost" && location.hostname !== "127.0.0.1" ? location.origin + "/" : j.url;
  if (!url) { document.getElementById("warnung").innerHTML = `<div class="warn">Keine Netzwerkverbindung gefunden.</div>`; return; }
  if (!j.erreichbar && url === j.url) {
    document.getElementById("warnung").innerHTML = `<div class="warn"><b>Noch nicht von anderen Geräten erreichbar.</b><br>
      Backend mit <code>./start.sh teilen</code> starten (bzw. uvicorn mit <code>--host 0.0.0.0</code>).</div>`;
  }
  const qr = qrcode(0, "M");
  qr.addData(url); qr.make();
  document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 2, scalable: true });
  document.getElementById("url").textContent = url.replace(/\/$/, "");
});
</script>
</body>
</html>
